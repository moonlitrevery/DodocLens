services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dodoclens-backend
    volumes:
      # Persist SQLite database and uploaded files
      - dodoclens_data:/app/data
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: dodoclens-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  dodoclens_data:
    name: dodoclens_data
